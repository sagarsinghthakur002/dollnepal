<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#d31b70">
<title>You're offline – DollNepal</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff8f3;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#262626;text-align:center;padding:24px}
  .card{max-width:360px}
  img{width:88px;height:88px;border-radius:50%;box-shadow:0 0 0 3px #f3d27a}
  h1{font-size:22px;margin:20px 0 8px}
  p{color:#525252;line-height:1.5;margin:0 0 20px;font-size:15px}
  button{background:linear-gradient(100deg,#ef2f87,#8b3fd9);color:#fff;border:0;border-radius:999px;padding:14px 28px;font-size:15px;font-weight:600;min-height:48px;width:100%}
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="DollNepal">
    <h1>You're offline</h1>
    <p>It looks like there's no internet connection. Check your connection and try again — your cart is saved on this device.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
